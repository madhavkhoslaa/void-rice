# Explicit opt-in. Instant changes only; no fading or animation.
backend = "glx";
experimental-backends = true;
use-damage = true;
vsync = true;
unredir-if-possible = true;
unredir-if-possible-delay = 0;
shadow = false;
fading = false;
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.0;
corner-radius = 10;
round-borders = 1;
rounded-corners-exclude = [
    "window_type = 'dock'", "window_type = 'desktop'", "fullscreen"
];
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-frame = false;
# Blur is visible only behind these translucent overlay windows.
opacity-rule = [ "92:class_g = 'Rofi'", "95:class_g = 'Dunst'" ];
blur-background-exclude = [
    "class_g != 'Rofi' && class_g != 'Dunst'",
    "window_type = 'dock'", "window_type = 'desktop'", "fullscreen"
];
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
